name: Generate Malilion UI profile cards

on:
  schedule:
    # Every 6 hours, off the top of the hour (where GitHub's scheduler queues up and delays runs).
    # Taiwan time: 02:17, 08:17, 14:17, 20:17.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# A newer run supersedes one still in progress, so two runs never race to push gh-pages.
concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts/profile-cards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/profile-cards/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Render profile cards with Malilion UI
        run: node render.mjs ../../dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
      - name: Publish profile cards
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub disables schedules in public repos after 60 days without repository activity.
      # Re-enabling the workflow resets that clock, so the cards keep updating on quiet months.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/profile-cards.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
